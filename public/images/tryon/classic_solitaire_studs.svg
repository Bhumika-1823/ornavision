<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#9E9E9E" />
    </linearGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#80DEEA" />
    </radialGradient>
  </defs>
  <!-- Platinum Claws -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#silver)" stroke-width="5"/>
  <line x1="18" y1="18" x2="82" y2="82" stroke="url(#silver)" stroke-width="6"/>
  <line x1="82" y1="18" x2="18" y2="82" stroke="url(#silver)" stroke-width="6"/>
  <!-- Main diamond stone -->
  <circle cx="50" cy="50" r="28" fill="url(#sparkle)"/>
  <polygon points="50,22 62,38 78,50 62,62 50,78 38,62 22,50 38,38" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="50" cy="50" r="10" fill="#E0F7FA" opacity="0.5"/>
</svg>
