<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="tikka-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AA771C" />
      <stop offset="30%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    
    <!-- Red Ruby Gradient -->
    <radialGradient id="ruby" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="40%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#8E0000" />
    </radialGradient>

    <!-- Pearl Gradient -->
    <radialGradient id="pearl" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5F5F0" />
      <stop offset="100%" stop-color="#D7D7D0" />
    </radialGradient>
  </defs>

  <!-- Hanging Chain -->
  <line x1="50" y1="10" x2="50" y2="100" stroke="url(#tikka-gold)" stroke-width="3" stroke-dasharray="1,5" stroke-linecap="round"/>
  
  <!-- Hook/Top Loop -->
  <circle cx="50" cy="10" r="4" fill="none" stroke="url(#tikka-gold)" stroke-width="2"/>
  
  <!-- Tiny Gold Beads along the chain -->
  <circle cx="50" cy="30" r="3" fill="url(#tikka-gold)"/>
  <circle cx="50" cy="55" r="3" fill="url(#tikka-gold)"/>
  <circle cx="50" cy="80" r="3" fill="url(#tikka-gold)"/>

  <!-- Pendant Cap -->
  <polygon points="50,95 40,110 60,110" fill="url(#tikka-gold)"/>
  <circle cx="50" cy="105" r="4" fill="url(#ruby)"/>

  <!-- Main Chandbali Crescent Pendant -->
  <path d="M 50 110 C 25 110, 15 130, 20 150 C 25 170, 40 180, 50 180 C 60 180, 75 170, 80 150 C 85 130, 75 110, 50 110 Z" fill="url(#tikka-gold)"/>
  
  <!-- Inner Crescent Cutout (making it a moon shape) -->
  <path d="M 50 120 C 35 120, 28 132, 30 145 C 32 158, 42 165, 50 165 C 58 165, 68 158, 70 145 C 72 132, 65 120, 50 120 Z" fill="#0c0c0e" opacity="0.95"/>

  <!-- Center teardrop gem inside crescent -->
  <path d="M 50 130 C 45 140, 43 148, 50 155 C 57 148, 55 140, 50 130 Z" fill="url(#ruby)"/>

  <!-- Hanging Pearl Droplets at the bottom edge -->
  <!-- Left Side Pearls -->
  <line x1="28" y1="158" x2="28" y2="170" stroke="url(#tikka-gold)" stroke-width="1.5"/>
  <circle cx="28" cy="172" r="3.5" fill="url(#pearl)"/>
  
  <line x1="38" y1="172" x2="38" y2="185" stroke="url(#tikka-gold)" stroke-width="1.5"/>
  <circle cx="38" cy="187" r="3.5" fill="url(#pearl)"/>
  
  <!-- Central Pearl -->
  <line x1="50" y1="180" x2="50" y2="194" stroke="url(#tikka-gold)" stroke-width="1.5"/>
  <circle cx="50" cy="196" r="4.5" fill="url(#pearl)"/>
  
  <!-- Right Side Pearls -->
  <line x1="62" y1="172" x2="62" y2="185" stroke="url(#tikka-gold)" stroke-width="1.5"/>
  <circle cx="62" cy="187" r="3.5" fill="url(#pearl)"/>
  
  <line x1="72" y1="158" x2="72" y2="170" stroke="url(#tikka-gold)" stroke-width="1.5"/>
  <circle cx="72" cy="172" r="3.5" fill="url(#pearl)"/>
</svg>
