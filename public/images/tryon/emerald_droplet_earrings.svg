<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 200" width="100" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="50%" stop-color="#FCF6BA" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A86B" />
      <stop offset="50%" stop-color="#005C3E" />
      <stop offset="100%" stop-color="#043927" />
    </linearGradient>
  </defs>
  <!-- Earring hook -->
  <path d="M 50 10 A 15 15 0 0 1 50 40 L 50 60" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <!-- Golden connection loop -->
  <circle cx="50" cy="65" r="8" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- Emerald teardrop -->
  <path d="M 50 73 C 25 120 20 160 50 180 C 80 160 75 120 50 73 Z" fill="url(#emerald)" stroke="url(#gold)" stroke-width="2"/>
  <!-- Inner highlights for depth -->
  <path d="M 50 85 C 38 120 35 150 50 165 Z" fill="#50C878" opacity="0.6"/>
  <circle cx="50" cy="130" r="6" fill="#FFFFFF" opacity="0.3"/>
</svg>
